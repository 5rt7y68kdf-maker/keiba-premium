<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>JRA中央競馬 AI出馬表プレミアム製品版</title>
    <!-- 🚀【ZIP解凍の核心】ZIPファイルをブラウザ上で全自動解凍するための公式部品（JSZip）をネットからガチ結合！ -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #0a0a0a; color: #dddddd; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 550px; margin: 0 auto; background: #151515; padding: 20px; border-radius: 20px; border: 1px solid #d4af37; box-shadow: 0 8px 30px rgba(212,175,55,0.15); }
        h1 { font-size: 1.4rem; color: #d4af37; margin: 0 0 15px 0; font-weight: bold; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #aa8822; margin-bottom: 20px; font-weight: bold; }
        .selector-box { text-align: left; background: #1c1c1c; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .select-input, .text-input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; box-sizing: border-box; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .select-input { -webkit-appearance: none; }
        .btn-predict { width: 100%; background: linear-gradient(135deg, #e53e3e 0%, #9b2c2c 100%); color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #5b1414; }
        .prediction-box { background: #1c140c; border: 2px solid #dc2626; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 5px; color: #ddd; }
        th, td { padding: 12px 4px; border-bottom: 1px solid #333; text-align: center; }
        th { background-color: #222; color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 AI最高峰出馬表＆全馬券シミュレーター</h1>
        <div class="subtitle">JRAプレミアム過去ログ・ZIP解凍追跡検証版</div>
        
        <div class="selector-box">
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ① 開催年月日を選択してください</p>
            <input type="date" id="sim-date" class="select-input" value="" onclick="try{this.showPicker();}catch(e){}" onfocus="try{this.showPicker();}catch(e){}">
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ② 競馬場を選択してください</p>
            <select id="sim-venue" class="select-input">
                <option value="" selected>-- 競馬場を選択してください --</option>
                <option value="東京">東京</option>
                <option value="中山">中山</option>
                <option value="京都">京都</option>
                <option value="阪神">阪神</option>
            </select>
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ③ レース番号を選択してください</p>
            <select id="sim-race" class="select-input">
                <option value="" selected>-- レース番号を選択してください --</option>
                <option value="1R">1R</option>
                <option value="2R">2R</option>
                <option value="11R">11R</option>
            </select>
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ④ 馬場傾向を選択</p>
            <select id="sim-bias" class="select-input">
                <option value="フラット">フラット（標準傾向・実力通り）</option>
            </select>
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ⑤ 購入する馬券のジャンル</p>
            <select id="sim-ticket" class="select-input">
                <option value="1">単勝馬券</option>
            </select>
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ⑥ 投資金額を入力してください（円）</p>
            <input type="tel" id="sim-money" class="text-input" value="1000">
            
            <button id="predict-btn" class="btn-predict" onclick="loadAndUnzipJraDatabase()">🧠 指定レースのデータ検索を実行</button>
        </div>

        <div class="prediction-box">
            <div style="color:#d4af37; font-weight:bold; margin-bottom:10px;">📋 検索結果一覧</div>
            <table>
                <thead>
                    <tr><th>枠-馬</th><th>競走馬名</th><th>騎手</th><th>オッズ</th></tr>
                </thead>
                <tbody id="predict-tbody">
                    <tr><td colspan="4" style="color:#666; padding:20px 0; text-align: center;">条件を指定し、上の赤いボタンを押してください</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadAndUnzipJraDatabase() {
            // 🟥 【追跡1】ボタンクリックチェック
            alert("➔ [ステップ1] 検索ボタンのクリックイベント発火に成功しました！");

            var rawDate = document.getElementById("sim-date").value;
            if(!rawDate){ alert("❌ 日付を選択してください"); return; }
            var cG = rawDate.replace(/-/g, "").replace(/\//g, "").trim();
            var cV = document.getElementById("sim-venue").value;
            var cR = document.getElementById("sim-race").value;
            var cM = parseInt(document.getElementById("sim-money").value) || 0;
            
            var btn = document.getElementById("predict-btn");
            btn.innerText = "解凍検証中...";

            // 🚀 Publicフォルダ内の相対パスを直接指定 [1.26]
            var target_zip_url = "racedata.zip";
            
            // 🟥 【追跡2】ZIP取得通信（fetch）の開始
            alert("➔ [ステップ2] これより、同じサーバー内にある 'racedata.zip' の吸い上げ電波（fetch）を飛ばします。");

            fetch(target_zip_url, { method: "GET", cache: "no-cache" })
                .then(response => {
                    // 🟥 【追跡3】ZIPの存在・通信応答チェック
                    alert("➔ [ステップ3] サーバーから応答がありました！\n通信結果の成否（okかどうか）: " + response.ok + "\nステータスコード: " + response.status);
                    if(!response.ok) { 
                        alert("❌ 警告: サーバー上に 'racedata.zip' が見つからないか、読み込み拒否されました（404等）。ファイルが本当に存在するか確認してください。");
                        throw new Error("ZIP取得失敗"); 
                    }
                    return response.arrayBuffer();
                })
                .then(async (buffer) => {
                    // 🟥 【追跡4】JSZip解凍命令の直撃チェック
                    alert("➔ [ステップ4] ZIPのデータ（バイナリ）の吸い込みに成功しました！\nこれより、JSZipライブラリにデータをぶち込んで『強制解凍・開封』を執行します。");
                    
                    var zip;
                    try {
                        zip = await JSZip.loadAsync(buffer);
                        alert("➔ [ステップ5] ZIPフォルダのパスワード・破損の壁を完全突破！箱を開けることに成功しました！");
                    } catch(zipErr) {
                        alert("❌ 警告: ZIPファイルそのものが破損しているか、JSZipが解凍に失敗しました。原因: " + zipErr.message);
                        btn.innerText = "🧠 指定レースのデータ検索を実行";
                        return;
                    }
                    
                    // 🟥 【追跡5】ZIP内のテキストファイル認識チェック
                    var file = null;
                    var innerFiles = [];
                    zip.forEach(function (relativePath, zipEntry) {
                        innerFiles.push(relativePath);
                        if (relativePath.toLowerCase().endsWith(".txt")) {
                            file = zipEntry;
                        }
                    });
                    
                    alert("📦 ZIPの中に入っていたファイル名一覧:\n" + innerFiles.join("\n"));
                    
                    if(!file) { 
                        alert("❌ 警告: ZIPの箱は開きましたが、その中に '.txt' の生データファイルが1文字も見つかりません！"); 
                        btn.innerText = "🧠 指定レースのデータ検索を実行"; 
                        return; 
                    }
                    
                    // 🟥 【追跡6】テキスト抽出・文字コード変換チェック
                    alert("➔ [ステップ6] ZIP内にあるテキストファイル '" + file.name + "' を検知。中身の文字を Shift-JIS から日本語に翻訳します。");
                    
                    var textBuffer = await file.async("arraybuffer");
                    var decoder = new TextDecoder("shift_jis");
                    var text = decoder.decode(textBuffer);
                    var allLines = text.split(/\r?\n/);
                    
                    alert("➔ [ステップ7] 翻訳に大成功！データが文字として読み込めました。\n生データの全行数: " + allLines.length + " 行\n（これより馬名の一致検索を開始します）");
                    
                    var matched_horses = [];
                    for(var i=0; i<allLines.length; i++) {
                        var line = allLines[i].trim();
                        if(!line) continue;
                        
                        var d = line.split(/[\s,]+/);
                        if(d.length < 7) continue;
                        
                        var file_date = d[0].replace(/-/g,"").replace(/\//g,"").trim();
                        if(file_date.length === 6) { file_date = "20" + file_date; }
                        var file_venue = d[1].trim();
                        var file_race = d[2].toUpperCase().replace("R","").trim() + "R";
                        
                        if(file_date === cG && file_venue === cV && file_race === cR) {
                            matched_horses.push({
                                waku: d[3] || 0, num: d[4] || 0, name: d[5] || "不明", jockey: d[6] || "不明", odds: d[7] || "0.0"
                            });
                        }
                    }

                    alert("🎯 検索完了！\n選択された条件（" + cG + " " + cV + " " + cR + "）と一致した競走馬の数: " + matched_horses.length + " 頭");

                    if (matched_horses.length === 0) {
                        alert("⚠️ 警告: ZIPの中身は100%正常に読めましたが、選択された日付・場所・レースに一致する行が1行もありません！データの日程を確認してください。\n【検証用例】2026-05-03 ➔ 東京 ➔ 11R");
                        btn.innerText = "🧠 指定レースのデータ検索を実行"; return;
                    }

                    matched_horses.sort((a, b) => a.num - b.num);

                    var html = "";
                    for (var j = 0; j < matched_horses.length; j++) {
                        var h = matched_horses[j];
