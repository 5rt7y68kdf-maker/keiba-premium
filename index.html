<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>JRA競馬AI 出馬表デバッグ検証版</title>
    <style>
        body { font-family: sans-serif; background-color: #0a0a0a; color: #dddddd; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 550px; margin: 0 auto; background: #151515; padding: 20px; border-radius: 20px; border: 1px solid #d4af37; }
        .select-input, .text-input { width: 100%; padding: 12px; font-size: 1rem; margin-bottom: 15px; background: #111; color: #fff; box-sizing: border-box; }
        .btn-predict { width: 100%; background: #e53e3e; color: white; padding: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .prediction-box { background: #1c140c; border: 2px solid #dc2626; padding: 15px; margin-top: 20px; text-align: left; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th, td { padding: 12px 4px; border-bottom: 1px solid #333; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 JRA中央競馬 AI出馬表（デバッグ検証版）</h1>
        <div class="selector-box">
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ① 開催年月日</p>
            <input type="date" id="sim-date" class="select-input" value="" onclick="try{this.showPicker();}catch(e){}" onfocus="try{this.showPicker();}catch(e){}">
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ② 競馬場</p>
            <select id="sim-venue" class="select-input">
                <option value="">-- 競馬場を選択 --</option>
                <option value="東京">東京</option>
                <option value="中山">中山</option>
                <option value="京都">京都</option>
                <option value="阪神">阪神</option>
            </select>
            
            <p style="font-size:0.8rem; font-weight:bold; color:#aaa; margin: 4px 0;">➔ ③ レース番号</p>
            <select id="sim-race" class="select-input">
                <option value="">-- レース番号を選択 --</option>
                <option value="1R">1R</option>
                <option value="2R">2R</option>
                <option value="11R">11R</option>
            </select>
            
            <input type="hidden" id="sim-bias" value="フラット">
            <input type="hidden" id="sim-ticket" value="1">
            <input type="tel" id="sim-money" class="text-input" placeholder="投資金額（例：1000）" value="1000">
            
            <button id="predict-btn" class="btn-predict" onclick="searchJraDebugWorkflow()">🧠 指定レースのデータ検索を実行</button>
        </div>

        <div class="prediction-box">
            <table>
                <thead>
                    <tr><th>枠-馬</th><th>競走馬名</th><th>騎手</th><th>オッズ</th></tr>
                </thead>
                <tbody id="predict-tbody">
                    <tr><td colspan="4" style="color:#666; text-align: center;">ここに結果が表示されます</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function searchJraDebugWorkflow() {
            // 🛑 【確認1】ボタン押下（クリックイベントの発火チェック）
            alert("➔ [段階1] [フロント] ボタン押下を検知しました！（クリックイベント発火成功）");
            console.log("➔ [段階1] [フロント] ボタン押下を検知（発火成功）");

            var rawDate = document.getElementById("sim-date").value;
            var cG = rawDate.replace(/-/g, "").replace(/\//g, "").trim();
            var cV = document.getElementById("sim-venue").value;
            var cR = document.getElementById("sim-race").value;
            var cM = parseInt(document.getElementById("sim-money").value) || 0;

            if(!rawDate || !cV || !cR || cM <= 0) {
                alert("⚠️ 項目が未入力、または不完全です。日付・場所・レースを選択してください。");
                console.log("⚠️ [フロント] 入力不完全のため中断");
                return;
            }

            // 🛑 【確認2】API到達（フロントからFlaskへの送信チェック）
            var api_url = window.location.origin + "/api/predict?date=" + cG + "&venue=" + cV + "&race=" + cR;
            alert("➔ [段階2] [フロント] これよりFlaskの検索APIへ送信を試みます。\n宛先URL: " + api_url);
            console.log("➔ [段階2] [フロント] Flask APIへfetchリクエスト送信開始 URL: " + api_url);

            fetch(api_url)
                .then(res => {
                    alert("➔ [フロント] サーバーからHTTP応答を受信しました。\nHTTPステータスコード: " + res.status);
                    console.log("➔ [フロント] HTTP応答受信 ステータス: " + res.status);
                    if (!res.ok) {
                        throw new Error("サーバーがエラーを返しました。ステータス: " + res.status);
                    }
                    return res.json();
                })
                .then(matched_horses => {
                    // 🛑 【確認7】検索結果取得（APIからフロントへのデータ返却チェック）
                    alert("➔ [段階6] [フロント] サーバーからのデータ受信に成功しました！\n受信した競走馬の数: " + (matched_horses ? matched_horses.length : 0) + "頭");
                    console.log("➔ [段階6] [フロント] データ受信完了: ", matched_horses);

                    // 🛑 【確認8】画面へ返却（HTMLへのレンダリング・描画処理チェック）
                    alert("➔ [段階7] [フロント] これより受信したデータを画面のテーブルへ上書き描画します。");
                    console.log("➔ [段階7] [フロント] 画面テーブルの差し替え開始");

                    if (!matched_horses || matched_horses.length === 0) {
                        document.getElementById("predict-tbody").innerHTML = "<tr><td colspan='4' style='color:#ecc94b;'>該当する馬データが0件です。</td></tr>";
                        alert("⚠️ 検索結果は正常に返ってきましたが、一致する馬データが0件（空配列）でした。データの日程を確認してください。");
                        return;
                    }

                    var html = "";
                    for (var j = 0; j < matched_horses.length; j++) {
                        var h = matched_horses[j];
                        html += `<tr><td>${h.waku}枠${h.num}番</td><td><b>${h.name}</b></td><td>${h.jockey}</td><td>${h.odds}倍</td></tr>`;
                    }
                    document.getElementById("predict-tbody").innerHTML = html;
                    
                    alert("🎯 [デバッグ完了] 画面への描画まで100%エラーなく完全に通過しました！");
                    console.log("🎯 [フロント] 画面描画完了（全工程通過）");
                })
                .catch(err => {
                    alert("❌ [フロント内クラッシュ] 処理の途中でエラーが発生しました。\n内容: " + err.message);
                    console.log("❌ [フロントクラッシュ] ", err);
                });
        }
    </script>
</body>
</html>
